on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

name: Build

permissions:
  contents: read

jobs:
  host_builds:
    strategy:
      matrix:
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Build ${{ matrix.os }} Prebuild
        run: node .github/scripts/libmongocrypt.mjs --build
        shell: bash

      - id: upload
        name: Upload prebuild
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}
          path: prebuilds/
          if-no-files-found: 'error'
          retention-days: 1
          compression-level: 0

  # The macOS prebuild is universal and is built on an arm64 runner, so loading it in an x64
  # process is the only way to exercise its x86_64 half.
  test_macos_x64_prebuild:
    needs: host_builds
    runs-on: macos-26-intel
    strategy:
      matrix:
        node: [20.19.0, 22.x, 24.x]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Download the macOS prebuild
        uses: actions/download-artifact@v8
        with:
          name: build-macos-latest
          path: prebuilds/

      # Install without scripts so the prebuild we just downloaded is the one under test
      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Unpack the prebuild
        run: tar -xzf prebuilds/*darwin-arm64.tar.gz

      - name: Test the prebuild on x64
        run: npm run test

  container_builds_glibc:
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        linux_arch: [s390x, arm64, amd64]
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Buildx
        run: |
          docker buildx create --name builder --bootstrap --use
          docker buildx build \
            --platform linux/${{ matrix.linux_arch }} \
            --build-arg="NODE_ARCH=${{ matrix.linux_arch == 'amd64' && 'x64' || matrix.linux_arch }}" \
            --output type=local,dest=./prebuilds,platform-split=false \
            -f ./.github/docker/Dockerfile.glibc \
            .

      - id: upload
        name: Upload prebuild
        uses: actions/upload-artifact@v7
        with:
          name: build-linux-glibc-${{ matrix.linux_arch }}
          path: prebuilds/
          if-no-files-found: 'error'
          retention-days: 1
          compression-level: 0

  container_tests_musl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        linux_arch: [amd64, arm64]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Buildx
        run: |
          docker buildx create --name builder --bootstrap --use
          docker --debug buildx build --progress=plain --no-cache \
            --platform linux/${{ matrix.linux_arch }} \
            --build-arg="PLATFORM=${{ matrix.linux_arch == 'arm64' && 'arm64v8' || matrix.linux_arch }}" \
            --output type=local,dest=./prebuilds,platform-split=false \
            -f ./.github/docker/Dockerfile.musl \
            .
      - id: upload
        name: Upload prebuild
        uses: actions/upload-artifact@v7
        with:
          name: build-linux-musl-${{ matrix.linux_arch }}
          path: prebuilds/
          if-no-files-found: "error"
          retention-days: 1
          compression-level: 0